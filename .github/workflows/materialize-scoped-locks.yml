name: Materialize scoped active run locks change

on:
  push:
    branches:
      - work/active-lock-scopes/repository-host-coordination

permissions:
  contents: write

concurrency:
  group: materialize-scoped-locks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and extract source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .mustflow/tmp-scoped-locks/part-* > /tmp/scoped-locks.tar.gz.b64
          base64 --decode /tmp/scoped-locks.tar.gz.b64 > /tmp/scoped-locks.tar.gz
          printf '%s  %s\n' \
            '468355eda6443e836f79319f0820650ae9fb2cfaef246f7b942fb59fc398e464' \
            '/tmp/scoped-locks.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/scoped-locks.tar.gz -C .
          rm -rf .mustflow/tmp-scoped-locks
          rm -f .github/workflows/materialize-scoped-locks.yml

      - name: Commit materialized change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat(locking): coordinate active runs across scopes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
