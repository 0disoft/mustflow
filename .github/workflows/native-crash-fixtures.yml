name: Native crash fixture validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/native-crash-fixtures.yml"
      - "scripts/cross-validate-native-crash-fixtures.ts"
      - "src/core/native-crash-fixture-external-validation.ts"
      - "tests/cli/helpers/native-crash-fixtures.js"
      - "tools/native-crash-fixture-parser/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-crash-fixtures.yml"
      - "scripts/cross-validate-native-crash-fixtures.ts"
      - "src/core/native-crash-fixture-external-validation.ts"
      - "tests/cli/helpers/native-crash-fixtures.js"
      - "tools/native-crash-fixture-parser/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-crash-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-validation:
    name: Semantic validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --no-self-update

      - name: Report Rust toolchain identity
        run: rustc +1.96.1 --version --verbose

      - name: Build independent semantic parser
        run: cargo +1.96.1 build --locked --manifest-path tools/native-crash-fixture-parser/Cargo.toml

      - name: Cross-validate deterministic fixtures
        run: bun run scripts/cross-validate-native-crash-fixtures.ts
