name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed surfaces
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
      docs: ${{ steps.filter.outputs.docs }}
      package: ${{ steps.filter.outputs.package }}
      windows: ${{ steps.filter.outputs.windows }}
      site: ${{ steps.filter.outputs.site }}
      skills: ${{ steps.filter.outputs.skills }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            source:
              - 'src/**'
              - 'scripts/**'
              - 'tests/**'
              - '.mustflow/config/**'
              - '.mustflow/docs/**'
              - 'package.json'
              - 'bun.lock'
            docs:
              - 'docs-site/src/content/docs/**'
              - 'README.md'
            package:
              - 'templates/**'
              - 'scripts/release-plan.mjs'
              - '.github/workflows/publish-npm.yml'
            windows:
              - 'src/cli/lib/process-*.ts'
              - 'src/core/process-*.ts'
              - 'src/**/windows*.ts'
              - 'tests/cli/*windows*.test.js'
            site:
              - 'docs-site/**'
            skills:
              - '.mustflow/skills/**'
              - 'templates/default/locales/en/.mustflow/skills/**'
              - 'templates/default/manifest.toml'
              - 'templates/default/i18n.toml'

  validate:
    name: Validate CLI and docs
    runs-on: ubuntu-latest
    needs: changes
    # Full gate on main push and dispatch; on PRs run only when a relevant
    # surface changed (audit P1-10: docs-site install and packed-install smoke
    # should not run for a one-line source change).
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.source == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.package == 'true' ||
      needs.changes.outputs.site == 'true' ||
      needs.changes.outputs.skills == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check CLI package
        run: bun run check
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.source == 'true' ||
          needs.changes.outputs.package == 'true'

      - name: Check skill contracts and route evaluation
        run: bun run test:skill-contracts && bun run scripts/evaluate-skill-routes.ts
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.skills == 'true'

      - name: Check Node-only core path
        run: npm run check:core:node
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.source == 'true' ||
          needs.changes.outputs.windows == 'true'

      - name: Check packed install smoke
        run: npm run check:install
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.package == 'true' ||
          needs.changes.outputs.source == 'true'

      - name: Install documentation site dependencies
        run: bun install --frozen-lockfile
        working-directory: docs-site
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.docs == 'true' ||
          needs.changes.outputs.site == 'true'

      - name: Check documentation site
        run: bun run docs:check
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.docs == 'true' ||
          needs.changes.outputs.site == 'true'

  windows-core:
    name: Windows Node core check
    runs-on: windows-latest
    needs: changes
    # Windows-sensitive paths only on PRs; always on main push (audit P1-10).
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.windows == 'true' ||
      needs.changes.outputs.source == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Node-only core path
        run: npm run check:core:node
