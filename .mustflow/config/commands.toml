lifecycle = "oneshot"
run_policy = "agent_allowed"
description = "Inspect stale, redundant, or mock-heavy test candidates."
argv = ["bun", "run", "test:audit"]
cwd = "."
timeout_seconds = 300
stdin = "closed"
success_exit_codes = [0]
writes = []
network = false
destructive = false
required_after = ["test_change", "behavior_removed", "public_api_change"]

[intents.dependency_update_bun]
status = "configured"
lifecycle = "oneshot"
run_policy = "agent_allowed"
description = "Update Bun-managed dependencies and refresh bun.lock for maintainer-requested dependency upgrade work."
argv = ["bun", "update"]
cwd = "."
timeout_seconds = 900
stdin = "closed"
success_exit_codes = [0]
writes = ["bun.lock"]
network = true
destructive = false
required_after = ["package_metadata_change"]

[intents.docs_site_security_update]
status = "configured"
lifecycle = "oneshot"
run_policy = "agent_allowed"
description = "Resolve the reviewed Astro and Sharp security upgrade in the isolated documentation site dependency graph."
argv = ["bun", "update", "astro", "sharp"]
cwd = "docs-site"
timeout_seconds = 300
stdin = "closed"
success_exit_codes = [0]
writes = ["docs-site/package.json", "docs-site/bun.lock", "docs-site/node_modules/**"]
network = true
destructive = false
approval_actions = ["dependency_upgrade"]
required_after = ["security_advisory_review", "docs_site_package_metadata_change"]

[intents.test_coverage]
status = "manual_only"
description = "Inspect Node's coverage report for the fast mustflow CLI baseline."
reason = "Coverage output is interpretive and may be slow on local machines."
agent_action = "do_not_run_report_manual"
required_after = ["test_policy_change", "coverage_request"]

[intents.asset_optimize]
status = "manual_only"
description = "Optimize web image assets with a maintainer-reviewed asset pipeline."
