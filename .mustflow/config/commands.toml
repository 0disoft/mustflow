argv = ["bun", "run", "docs:check"]
cwd = "."
timeout_seconds = 900
stdin = "closed"
success_exit_codes = [0]
writes = ["docs-site/dist/**", "docs-site/.astro/**"]
network = false
destructive = false
required_after = ["docs_change", "release_risk", "before_publish"]

[intents.docs_review_add_changed]
status = "configured"
kind = "mustflow_builtin"
lifecycle = "oneshot"
run_policy = "agent_allowed"
description = "Add changed documentation review candidates from git status to the review queue."
argv = ["node", "dist/cli/index.js", "docs", "review", "add", "--changed"]
cwd = "."
timeout_seconds = 120
stdin = "closed"
success_exit_codes = [0]
writes = [".mustflow/review/docs.toml"]
effects = [{ type = "write", mode = "replace", path = ".mustflow/review/docs.toml", lock = "documentation_review_queue", concurrency = "exclusive" }]
network = false
destructive = false
# User-visible documentation changes go through the review queue. Internal
# skill, context, authoring, and i18n document changes are covered by
# mustflow_check schema/link/anchor validation instead (audit P1-12), so they
# no longer require a review-queue write.
required_after = ["docs_change", "copy_change"]

