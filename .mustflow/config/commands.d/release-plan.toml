[intents.release_plan_show]
status = "configured"
lifecycle = "oneshot"
run_policy = "agent_allowed"
description = "Validate and display a permanent typed release plan without changing Git state."
argv = ["node", "scripts/release-plan.mjs", "show", "{plan}"]
cwd = "."
timeout_seconds = 30
stdin = "closed"
success_exit_codes = [0]
writes = []
network = false
destructive = false
env_policy = "minimal"
[intents.release_plan_show.inputs.plan]
type = "path"
required = true
allowed_roots = [".mustflow/state/release-plans"]
allowed_extensions = [".json"]

[intents.release_plan_stage]
status = "configured"
lifecycle = "oneshot"
run_policy = "agent_allowed"
description = "Stage exactly the paths in a reviewed typed release plan whose base_head matches HEAD."
argv = ["node", "scripts/release-plan.mjs", "stage", "{plan}"]
cwd = "."
timeout_seconds = 60
stdin = "closed"
success_exit_codes = [0]
writes = [".git/index"]
effects = [{ type = "write", mode = "replace", path = ".git/index", lock = "git_index", concurrency = "exclusive" }]
network = false
destructive = false
env_policy = "minimal"
approval_actions = ["git_commit"]
[intents.release_plan_stage.inputs.plan]
type = "path"
required = true
allowed_roots = [".mustflow/state/release-plans"]
allowed_extensions = [".json"]

[intents.release_plan_commit]
status = "configured"
lifecycle = "oneshot"
run_policy = "agent_allowed"
description = "Commit only when the staged path set exactly matches a reviewed typed release plan."
argv = ["node", "scripts/release-plan.mjs", "commit", "{plan}"]
cwd = "."
timeout_seconds = 120
stdin = "closed"
success_exit_codes = [0]
writes = [".git/**"]
effects = [{ type = "write", mode = "replace", lock = "git_history", concurrency = "exclusive" }]
network = false
destructive = false
env_policy = "minimal"
approval_actions = ["git_commit"]
[intents.release_plan_commit.inputs.plan]
type = "path"
required = true
allowed_roots = [".mustflow/state/release-plans"]
allowed_extensions = [".json"]
