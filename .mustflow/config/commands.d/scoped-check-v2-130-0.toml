[intents.test_scoped_check_v2_130_0]
status = "configured"
lifecycle = "oneshot"
run_policy = "agent_allowed"
description = "Run focused scoped-check behavior and public JSON schema regressions for the 2.130.0 concurrency fix."
argv = ["node", "--test", "tests/cli/authoring-skill-contracts.test.js", "tests/cli/authoring-skill-release-support-contracts.test.js", "tests/cli/check.test.js", "tests/cli/package-template.test.js", "tests/cli/run-execution.test.js", "tests/cli/schema-cli-output-contracts.test.js"]
cwd = "."
timeout_seconds = 600
stdin = "closed"
success_exit_codes = [0]
writes = []
network = false
destructive = false
env_policy = "minimal"
required_after = ["scoped_check_change", "check_report_schema_change", "before_related_tests"]

[intents.manifest_lock_accept_scoped_check_v2_130_0]
status = "configured"
kind = "mustflow_builtin"
lifecycle = "oneshot"
run_policy = "agent_allowed"
description = "Accept only the reviewed 2.130.0 root workflow and scoped-check command authority baselines."
argv = [
  "node",
  "scripts/accept-manifest-lock-baseline.mjs",
  "AGENTS.md",
  ".mustflow/docs/agent-workflow.md",
  ".mustflow/config/commands.toml",
  ".mustflow/config/commands.d/scoped-check-v2-130-0.toml",
]
cwd = "."
timeout_seconds = 120
stdin = "closed"
success_exit_codes = [0]
writes = [".mustflow/config/manifest.lock.toml"]
effects = [{ type = "write", mode = "replace", path = ".mustflow/config/manifest.lock.toml", lock = "manifest_lock_baseline", concurrency = "exclusive" }]
network = false
destructive = false
required_after = ["reviewed_scoped_check_workflow_change", "before_mustflow_check"]

